name: Buyer access frontend
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  buyer-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend
        run: |
          node --check app.mjs
          node --check buyer-access.mjs
          npm test
# The real backend integration suite runs inside the private website repository.
# Its workflow pins this public frontend's exact commit. Do not add a private
# backend token here or publish backend source to this public repository.
