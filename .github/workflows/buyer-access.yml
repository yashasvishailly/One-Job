name: Buyer access contract

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  buyer-access:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check frontend
        run: |
          node --check app.mjs
          node --check buyer-access.mjs
          npm test
      - name: Check out the verified backend contract
        uses: actions/checkout@v4
        with:
          repository: yashasvishailly/yashasvishailly-com
          ref: 1fb69c0fad52166e628c924760504b4878b4424a
          path: _backend
          persist-credentials: false
      - name: Test frontend against the real backend with fake storage and email
        env:
          ONE_JOB_WEBSITE_ROOT: _backend
        run: npm run test:backend
